<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>静止与持续刷新对照</title>
  <style>
    :root { color-scheme: dark; background: #202020; color: #c0c0c0; }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; margin: 0; background: #202020; }
    body { font: 18px/1.65 system-ui, "Microsoft YaHei", sans-serif; }
    main { max-width: 800px; margin: 0 auto; padding: 28px 24px; }
    h1 { margin: 0 0 12px; font-size: 25px; font-weight: 600; }
    p { margin: 0 0 18px; }
    .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-bottom: 12px; }
    .toggle { display: inline-flex; align-items: center; gap: 10px; cursor: pointer; }
    input { width: 20px; height: 20px; margin: 0; accent-color: #a0a0a0; }
    #status { display: inline-block; width: 12em; font-size: 16px; }
    .track { position: relative; width: 252px; height: 22px; margin: 0 0 18px; background: #202020; }
    #dot { position: absolute; top: 8px; left: 0; width: 6px; height: 6px; border-radius: 50%; background: #808080; will-change: transform; }
    textarea { display: block; width: 100%; height: 220px; resize: none; padding: 14px; border: 1px solid #606060; border-radius: 4px; background: #202020; color: #c0c0c0; caret-color: #c0c0c0; font: 22px/1.65 system-ui, "Microsoft YaHei", sans-serif; }
    textarea:focus-visible, input:focus-visible { outline: 2px solid #909090; outline-offset: 3px; }
    .note { margin-top: 16px; color: #a0a0a0; font-size: 15px; }
  </style>
</head>
<body>
  <main>
    <h1>静止与持续刷新对照</h1>
    <p>先保持关闭，在下方输入几个字；再打开“持续刷新”，输入相同的文字。分别观察屏幕角落是否跳亮。</p>
    <div class="controls">
      <label class="toggle" for="refresh"><input id="refresh" type="checkbox">持续刷新</label>
      <span id="status" role="status" aria-live="polite">关闭（小点静止）</span>
    </div>
    <div class="track" aria-hidden="true"><div id="dot"></div></div>
    <label for="typing">在这里输入英文或拼音：</label>
    <textarea id="typing" spellcheck="false" autocomplete="off" autocapitalize="off" aria-describedby="test-note"></textarea>
    <p class="note" id="test-note">背景固定为中性深灰 RGB（32, 32, 32）。开启后只移动上方小点；关闭后小点留在原位。页面不更改系统设置。</p>
  </main>
  <script>
    "use strict";
    const refresh = document.getElementById("refresh");
    const status = document.getElementById("status");
    const dot = document.getElementById("dot");
    let frame = null;
    let phase = 0;
    let previousTime = null;

    function animate(time) {
      if (!refresh.checked) return;
      if (previousTime !== null) phase += (time - previousTime) / 2400;
      previousTime = time;
      const x = 123 * (1 - Math.cos(phase * Math.PI * 2));
      dot.style.transform = `translateX(${x.toFixed(3)}px)`;
      frame = requestAnimationFrame(animate);
    }

    refresh.addEventListener("change", () => {
      if (frame !== null) cancelAnimationFrame(frame);
      frame = null;
      previousTime = null;
      status.textContent = refresh.checked ? "开启（小点移动）" : "关闭（小点静止）";
      if (refresh.checked) frame = requestAnimationFrame(animate);
    });

    // Browsers may restore form state after a reload; always begin stopped.
    refresh.checked = false;
  </script>
</body>
</html>
